<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MapZap — Download Your Leads</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080A0F;--bg2:#0E1118;--bg3:#141820;--accent:#00E5FF;--accent2:#FFD600;--text:#F0F4FF;--muted:#6B7A99;--border:#1E2535}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--bg2);border:1px solid var(--border);padding:60px;max-width:600px;width:100%;text-align:center;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}
.card.pro::before{background:var(--accent2)}
.badge{display:inline-block;background:rgba(0,229,255,0.08);border:1px solid rgba(0,229,255,0.2);color:var(--accent);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:8px 16px;margin-bottom:24px}
.badge.pro{background:rgba(255,214,0,0.1);border-color:rgba(255,214,0,0.3);color:var(--accent2)}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:48px;line-height:1;margin-bottom:16px}
.sub{font-size:16px;color:var(--muted);margin-bottom:40px;line-height:1.6}
.form-group{margin-bottom:16px;text-align:left}
label{display:block;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'Barlow',sans-serif;font-size:16px;padding:14px 16px;outline:none;transition:border-color 0.2s}
input:focus{border-color:var(--accent)}
input::placeholder{color:var(--muted)}
.btn{width:100%;background:var(--accent);color:#000;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;letter-spacing:2px;padding:20px;border:none;cursor:pointer;margin-top:8px;transition:opacity 0.2s;display:flex;align-items:center;justify-content:center;gap:12px}
.btn.pro{background:var(--accent2)}
.btn:hover{opacity:0.85}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.status{margin-top:20px;padding:16px;font-size:14px;display:none}
.status.loading{display:block;background:rgba(0,229,255,0.05);border:1px solid rgba(0,229,255,0.2);color:var(--accent)}
.status.error{display:block;background:rgba(255,50,50,0.05);border:1px solid rgba(255,50,50,0.2);color:#FF6B6B}
.status.success{display:block;background:rgba(0,229,255,0.05);border:1px solid rgba(0,229,255,0.2);color:var(--accent)}
.spinner{width:20px;height:20px;border:2px solid rgba(0,0,0,0.3);border-top-color:#000;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note{margin-top:24px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="badge" id="badge">✓ PAYMENT CONFIRMED</div>
  <h1 id="heading">Get Your<br><span style="color:var(--accent)">Leads Now</span></h1>
  <p class="sub" id="sub">Enter what you're looking for and where. We'll pull up to 100 leads from Google Maps and deliver your CSV instantly.</p>
  <div class="form-group">
    <label>Business Type</label>
    <input type="text" id="businessType" placeholder="e.g. restaurants, dentists, gyms, law firms" />
  </div>
  <div class="form-group">
    <label>City & State</label>
    <input type="text" id="city" placeholder="e.g. Miami FL, Los Angeles CA, Austin TX" />
  </div>
  <button class="btn" id="scrapeBtn" onclick="startScrape()">
    <span id="btnText">DOWNLOAD MY LEADS →</span>
    <div class="spinner" id="spinner" style="display:none"></div>
  </button>
  <div class="status" id="status"></div>
  <p class="note" id="note">Powered by live Google Maps data. Results delivered as a CSV file ready to import anywhere.</p>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const sessionId = params.get('session_id');
const tier = params.get('tier') || 'basic';
const prefillType = params.get('type');
const prefillCity = params.get('city');

// Pre-fill from URL params or localStorage
const savedType = prefillType ? decodeURIComponent(prefillType) : localStorage.getItem('mz_type');
const savedCity = prefillCity ? decodeURIComponent(prefillCity) : localStorage.getItem('mz_city');
if(savedType) document.getElementById('businessType').value = savedType;
if(savedCity) document.getElementById('city').value = savedCity;

if(tier === 'pro') {
  document.getElementById('card').classList.add('pro');
  document.getElementById('badge').className = 'badge pro';
  document.getElementById('badge').textContent = '✓ PRO PAYMENT CONFIRMED';
  document.getElementById('heading').innerHTML = 'Get Your Leads<br><span style="color:var(--accent2)">+ Emails Now</span>';
  document.getElementById('sub').textContent = 'Enter what you\'re looking for and where. We\'ll pull up to 100 leads from Google Maps, find business emails where available, and deliver your CSV instantly.';
  document.getElementById('scrapeBtn').classList.add('pro');
  document.getElementById('btnText').textContent = 'DOWNLOAD LEADS + EMAILS →';
  document.getElementById('note').textContent = 'Emails found for roughly 30 to 40% of results on average. You still get the full 100 leads regardless.';
}

if(!sessionId) {
  document.getElementById('status').className = 'status error';
  document.getElementById('status').style.display = 'block';
  document.getElementById('status').textContent = 'No valid payment session found. Please complete payment first.';
  document.getElementById('scrapeBtn').disabled = true;
}

async function startScrape() {
  const businessType = document.getElementById('businessType').value.trim();
  const city = document.getElementById('city').value.trim();
  const btn = document.getElementById('scrapeBtn');
  const status = document.getElementById('status');
  const btnText = document.getElementById('btnText');
  const spinner = document.getElementById('spinner');
  if(!businessType || !city) {
    status.className = 'status error';
    status.textContent = 'Please enter both a business type and city.';
    return;
  }
  btn.disabled = true;
  spinner.style.display = 'block';
  status.className = 'status loading';
  if(tier === 'pro') {
    btnText.textContent = 'FINDING EMAILS...';
    status.textContent = 'Pulling live data from Google Maps and finding business emails. This takes 1 to 2 minutes...';
  } else {
    btnText.textContent = 'SCRAPING GOOGLE MAPS...';
    status.textContent = 'Pulling live data from Google Maps. This takes 15 to 30 seconds...';
  }
  try {
    const response = await fetch('https://api.mapzap.org/api/scrape', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sessionId, business_type: businessType, city: city, tier: tier})
    });
    if(!response.ok) {
      const err = await response.json();
      throw new Error(err.error || 'Scrape failed');
    }
    const blob = await response.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${businessType.replace(/ /g,'_')}_${city.replace(/[, ]+/g,'_')}_leads.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);
    // Clear localStorage after successful download
    localStorage.removeItem('mz_type');
    localStorage.removeItem('mz_city');
    status.className = 'status success';
    status.textContent = '✓ Your CSV is downloading now. Check your downloads folder.';
    btnText.textContent = 'DOWNLOADED ✓';
    spinner.style.display = 'none';
  } catch(err) {
    status.className = 'status error';
    status.textContent = `Error: ${err.message}. Email hello@mapzap.org for support.`;
    btn.disabled = false;
    btnText.textContent = 'TRY AGAIN';
    spinner.style.display = 'none';
  }
}
</script>
</body>
</html>
